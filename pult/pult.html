<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pult</title>
<style>
:root{
  color-scheme:light dark; --danger:#b83227; --on-accent:#fff;
  --bg:#f3f1ec; --panel:#ebe8e1; --card:#fff; --ink:#1c2430; --mute:#5d6775; --line:#dcd8cf;
  --accent:#0f5b57; --run:#1f6fd0; --wait:#a55e00; --rev:#2e7d4f; --brk:#737984;
  --shadow:0 10px 30px rgba(28,36,48,.16); --z:1;
}
@media (prefers-color-scheme: dark){
  :root{ --danger:#f07a6e; --on-accent:#0e1418; --bg:#12161c; --panel:#181d25; --card:#1f2630; --ink:#e8ecf1; --mute:#93a0b0; --line:#2c3541;
    --accent:#5fc7bf; --run:#6aa9f5; --wait:#f0a94a; --rev:#6fcf97; --brk:#8b95a3; --shadow:0 10px 30px rgba(0,0,0,.5); }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:color-mix(in srgb,var(--accent) 32%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.pulse{animation:p 1.4s ease-in-out infinite}
@keyframes p{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}#side{transition:none}}

/* shell */
#banner{background:#f6c344;color:#1c2430;padding:10px 20px;font-weight:600}
#app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh / var(--z) - var(--ban,0px))}
#side{position:sticky;top:0;height:calc(100vh / var(--z) - var(--ban,0px));overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:14px 10px 12px}
.brand{font-size:18px;font-weight:700;letter-spacing:.02em;padding:0 9px 10px}
.nav{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:7px 9px;border-radius:7px;text-align:left;cursor:pointer;min-width:0}
.nav>span:not(.n):not(.dot){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.nav:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.nav.on{background:color-mix(in srgb,var(--accent) 15%,transparent);font-weight:600}
.nav .n{margin-left:auto;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;font-weight:400}
.nav .n.hot{color:var(--wait);font-weight:700}
.nav.quiet{color:var(--mute)}
.sideh{font-size:12.5px;font-weight:600;color:var(--mute);padding:16px 9px 4px}
#plist{display:grid;gap:2px}
.sidefoot{margin-top:auto;padding-top:14px;display:grid;gap:8px}
.prow{display:flex;gap:6px;align-items:center;padding:0 3px;flex-wrap:wrap}
#scrim{display:none}
#bar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 20px}
#bar h1{font-size:17px;margin:0 6px 0 0;overflow-wrap:anywhere}
#menuBtn{display:none}
.search{display:flex;align-items:center;gap:7px;flex:1 1 180px;max-width:340px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:0 9px;color:var(--mute)}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;border:0;background:none;padding:6px 0;color:var(--ink);outline:none}
.search input::placeholder{color:var(--mute)}
.grow{flex:1}
#page{padding:18px 20px 44px;max-width:1500px}
#page h2{font-size:15px;margin:26px 0 8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
#page h2:first-child{margin-top:0}
#page h2 small,.hint{font-weight:400;color:var(--mute);font-size:13px}
.hint{margin:-4px 0 10px}
.foot{margin-top:28px;color:var(--mute);font-size:12px;overflow-wrap:anywhere}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:7px;padding:5px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--on-accent);font-weight:600}
.btn.icon{padding:6px}
.btn:not(:disabled):hover,.chip:hover{border-color:var(--mute)}
.btn.main:not(:disabled):hover{filter:brightness(1.08);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--mute);padding:5px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.seg button:not(.on):hover{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip b{font-weight:400;color:var(--mute);font-variant-numeric:tabular-nums}
.chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card));font-weight:600}
.tools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:0 0 12px}
select.sel,.field{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:5px 8px;font-size:13px}
.menu{position:relative}
.menu summary{list-style:none;cursor:pointer}
.menu summary::-webkit-details-marker{display:none}
.menu[open]>summary{border-color:var(--accent)}
.menu .pop{position:fixed;z-index:60;top:0;left:0;min-width:170px;max-width:280px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:5px;box-shadow:var(--shadow);display:grid;gap:2px}
.menu .pop button{border:0;background:none;font-size:13px;text-align:left;padding:6px 8px;border-radius:6px;cursor:pointer}
.menu .pop button:not(:disabled):hover{background:var(--panel)}
.menu .pop button:disabled{opacity:.5;cursor:default}
.menu .pop button.warn{color:var(--danger)}
.pop.dates{padding:10px;gap:8px}
.pop.dates label{display:grid;gap:3px;font-size:12.5px;color:var(--mute)}

/* overview */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--card);border:0;padding:11px 14px 12px;text-align:left;cursor:pointer;display:grid;gap:2px}
.stat:hover{background:color-mix(in srgb,var(--accent) 6%,var(--card))}
.stat b{font-size:22px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{color:var(--mute);font-size:13px;display:flex;gap:7px;align-items:center}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.box.tw{overflow-x:auto}
table.pt{width:100%;border-collapse:collapse}
.pt th{font-size:12.5px;font-weight:600;color:var(--mute);text-align:left;padding:8px 12px;white-space:nowrap}
.pt td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
.pt tbody tr{cursor:pointer}
.pt tbody tr:hover{background:color-mix(in srgb,var(--accent) 6%,var(--card))}
.pt .nx{color:var(--mute);font-size:13px;max-width:44ch}
.pt .hot{color:var(--wait);font-weight:700}
.pt .zero{color:var(--mute)}

/* rows and cards */
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.cur,.card.cur{background:color-mix(in srgb,var(--accent) 9%,var(--card))}
.rtitle{display:block;max-width:100%;border:0;background:none;padding:0;text-align:left;font-weight:600;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtitle:hover{text-decoration:underline}
.isdone .rtitle{text-decoration:line-through;text-decoration-color:var(--mute);color:var(--mute)}
.rsub{display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-top:2px;min-width:0}
.rsum{flex:1 1 200px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rside{display:flex;align-items:center;gap:10px}
.ago{color:var(--mute);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.st{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.plink{display:inline-flex;align-items:center;gap:5px;border:0;background:none;padding:0;color:var(--ink);cursor:pointer;font-size:12.5px;max-width:100%;overflow-wrap:anywhere;text-align:left}
.plink:hover{text-decoration:underline}
.tag{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:11.5px;color:var(--mute);text-decoration:none;white-space:nowrap}
.tag.flag{color:var(--wait);border-color:var(--wait)}
.prio{font-size:11.5px;font-weight:700;border-radius:4px;padding:0 6px;border:1px solid var(--pc);color:var(--pc);background:color-mix(in srgb,var(--pc) 13%,transparent);white-space:nowrap}
.p3{--pc:var(--danger)}.p2{--pc:var(--wait)}.p1{--pc:var(--mute)}
.pdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc,transparent);border:1px solid var(--pc,var(--line))}
.empty{color:var(--mute);padding:12px;font-size:13px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,340px);gap:12px;overflow-x:auto;align-items:start;padding-bottom:10px}
.col{background:var(--panel);border-radius:10px;padding:10px}
.col h3{font-size:13.5px;margin:1px 3px 2px;display:flex;align-items:center;gap:7px}
.col h3 b{font-weight:400;color:var(--mute);font-variant-numeric:tabular-nums}
.col .chint{color:var(--mute);font-size:12px;margin:0 3px 2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin-top:8px}
.card .rtitle{white-space:normal;overflow-wrap:anywhere;line-height:1.3}
.csum{color:var(--mute);font-size:13px;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
body.compact .rsum,body.compact .csum{display:none}
.err{color:var(--danger);font-size:12.5px;margin-top:6px;grid-column:1/-1}

/* project page */
.phead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.ppath{color:var(--mute);font-size:12.5px;overflow-wrap:anywhere;flex:1 1 100%}
.brief{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 14px;max-width:80ch}
.brief ul,.dbox ul{margin:0;padding-left:18px}
.lab{font-size:12.5px;font-weight:600;color:var(--mute);margin:0 0 3px}

/* detail panel */
#detail{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:40;background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shadow);overflow-y:auto;padding:0 18px 22px}
.dh{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0 10px;font-size:12.5px;color:var(--mute);z-index:1}
#detail h2{font-size:17px;line-height:1.3;margin:2px 0 8px;overflow-wrap:anywhere}
.dline{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:14px}
.dbox{margin-bottom:14px}
.dbox li{margin-bottom:3px;overflow-wrap:anywhere}
.dbox.ai{background:color-mix(in srgb,var(--accent) 9%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 26%,var(--card));border-radius:9px;padding:9px 12px}
.dbox.ai .lab{color:var(--accent)}
.ask{color:var(--mute);font-size:13px;overflow-wrap:anywhere;white-space:pre-wrap}
.meta{font-size:12.5px;color:var(--mute);margin-bottom:14px;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 14px;font-size:13px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);padding:0;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog.small{width:min(460px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
.sh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.sh h2{margin:0;font-size:17px}
.sb{padding:12px 18px 18px}
.form{display:grid;gap:10px}
.form label{display:grid;gap:3px;font-size:12.5px;color:var(--mute)}
.form select,.form textarea{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:6px 8px;color:var(--ink);font-size:14px;width:100%}
.form textarea{min-height:92px;resize:vertical}
.form .acts{justify-content:flex-end}
.srow{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.srow .ic{font-size:16px;width:20px;flex:none;text-align:center;margin-top:1px}
.srow .tx{flex:1;min-width:0}
.srow .tx b{display:block;margin-bottom:2px}
.srow .tx span{color:var(--mute);font-size:13px;overflow-wrap:anywhere}
.ok{color:var(--rev)} .no{color:var(--mute)}
.snote{color:var(--mute);font-size:12.5px;margin-top:12px}
.slist{margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--mute)}

@media (max-width: 760px){
  #app{grid-template-columns:minmax(0,1fr)}
  #side{position:fixed;left:0;top:0;bottom:0;width:min(280px,86vw);z-index:50;transform:translateX(-102%);transition:transform .2s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow)}
  body.nav-open #side{transform:none}
  body.nav-open #scrim{display:block;position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.4)}
  #menuBtn{display:inline-flex}
  #bar{padding:10px 14px}
  #bar h1{flex:1}
  .search{flex:1 1 100%;max-width:none;order:5}
  #page{padding:14px 14px 40px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row{grid-template-columns:minmax(0,1fr)}
  .rside{justify-content:space-between}
  .pt .wide{display:none}
  .pt th,.pt td{padding:8px 9px}
}
</style>
</head>
<body>
<div id="banner" hidden></div>
<div id="app">
<aside id="side">
  <div class="brand">Pult</div>
  <nav id="nav">
    <button class="nav" data-v="overview" data-i="home"><span data-t="navOverview"></span></button>
    <button class="nav" data-v="needs" data-i="inbox"><span data-t="navNeed"></span><span class="n" id="nNeed"></span></button>
    <button class="nav" data-v="all" data-i="list"><span data-t="navAll"></span><span class="n" id="nAll"></span></button>
    <button class="nav" data-v="archive" data-i="archive"><span data-t="archive"></span><span class="n" id="nArch"></span></button>
  </nav>
  <div class="sideh" data-t="projects"></div>
  <div id="plist"></div>
  <button class="nav quiet" id="add"><span data-t="addFolder"></span></button>
  <div class="sidefoot">
    <div class="prow"><button class="btn" id="tr"></button></div>
    <div class="prow"><button class="btn" id="dens"></button><span class="seg" id="zoom"><button data-z="-1">A−</button><button data-z="0" id="zval"></button><button data-z="1">A+</button></span></div>
    <div class="prow"><button class="btn" id="setupBtn" data-i="gear"><span data-t="setup"></span></button><div class="seg" id="lang"><button data-l="en">EN</button><button data-l="de">DE</button><button data-l="ru">RU</button></div></div>
  </div>
</aside>
<div id="scrim"></div>
<div id="main">
  <header id="bar">
    <button class="btn icon" id="menuBtn" data-i="menu"></button>
    <h1 id="ttl">Pult</h1>
    <label class="search" data-i="search"><input id="q" type="search" autocomplete="off"></label>
    <span class="grow"></span>
    <div class="seg" id="days"><button data-d="1" data-t="today"></button><button data-d="7" class="on" data-t="d7"></button><button data-d="30" data-t="d30"></button><button data-d="90" data-t="d90"></button><button data-d="3650" data-t="all"></button></div>
    <details class="menu" id="dateMenu"><summary class="btn" data-t="dates"></summary><div class="pop dates"><label><span data-t="from"></span><input class="field" type="date" id="from"></label><label><span data-t="to"></span><input class="field" type="date" id="to"></label></div></details>
    <button class="btn main" id="newBtn" data-i="plus"><span data-t="newChat"></span></button>
  </header>
  <main id="page"></main>
</div>
</div>
<aside id="detail" hidden></aside>
<div id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="setup"><div class="sh"><h2 data-t="setupTitle"></h2><button class="btn" id="setupClose" data-t="close"></button></div><div class="sb" id="setupBody"></div></dialog>
<dialog id="nc" class="small"><div class="sh"><h2 data-t="newChat"></h2><button class="btn" id="ncClose" data-t="close"></button></div>
  <div class="sb form"><label><span data-t="projectL"></span><select id="ncProj"></select></label>
  <label><span data-t="promptPh"></span><textarea id="ncText"></textarea></label>
  <label><span data-t="modelL"></span><select id="ncModel"><option value="" data-t="mDefault"></option><option value="opus">Opus</option><option value="sonnet">Sonnet</option><option value="haiku">Haiku</option></select></label>
  <div class="err" id="ncErr" hidden></div>
  <div class="acts"><button class="btn main" id="ncGo"></button></div></div></dialog>
<dialog id="cf" class="small"><div class="sb"><p id="cfText"></p><div class="acts"><button class="btn" id="cfNo" data-t="cancel"></button><button class="btn danger" id="cfYes"></button></div></div></dialog>
<script>
const TOKEN = "__TOKEN__", VERSION = "__VERSION__";
const OLD_SERVER = VERSION === "__" + "VERSION__";
const T = {
 en: {sub:"every Claude Code chat on this computer", archiveTab:n=>`Archive${n ? " · " + n : ""}`, doneCol:"Done", done:"Done", doneH:"Marked done by you or closed in coordinator", markDone:"✓ Done", reopen:"Reopen", toArchive:"Archive", restore:"Restore",
  moreBtn:"More", showMore:"Show more", showLess:"Show less", prioNone:"Priority", prioOff:"No priority", p3:"High", p2:"Medium", p1:"Low", compactOn:"Compact", compactOff:"Detailed",
  archEmpty:"The archive is empty. Use More > Archive on a card to move it here.", archHint:"Archived cards. A card comes back by itself when its chat gets new activity.",
  lastChange:"last change", noChange:"no files yet", filesN:n=>`${n} files`, chatsN:n=>`${n} Claude Code chats`, recently:"Recently changed",

  testRow:"Test workspace", testRowD:"Creates pult-testbed in your home folder with five small projects and starts five Claude Code chats in it (Opus and Sonnet). Uses your subscription.", testBtn:"Create and start 5 test chats", testDone:n=>`Started ${n} chats. The folder is on the board.`, repair:"Repair settings.json", repairD:"Your settings file has two JSON blocks one after the other. Pult merges them into one and keeps a backup.", setup:"Setup", setupTitle:"Coordinator rules", close:"Close", turnOn:"Turn on", turnOff:"Turn off", allOn:"Turn everything on",

  repoMissing:"The coordinator folder was not found next to Pult, so hooks and tools cannot be set up.",
  sNote:"Each change saves a backup next to the file first. Restart open Claude Code windows after a change.", working:"Working…", outdated:"Pult was updated, but the old version is still running. Close the black Pult window and double-click START.bat again.", d90:"90 days", openFolder:"Open folder", goProject:"Show this project on the board", all:"All", from:"from", to:"to", trOff:"Translate cards: off", trOn:"Translate cards: on", trBusy:n=>`Translating… ${n} left`,
  trTip:"Claude translates titles, points and requests of all cards into the interface language (uses your subscription; each chat is translated once)",

  else if (view === "needs") pageNeeds(page, shown);
  else if (view === "all") tasks(page, shown, "all");
  else if (view === "archive") pageArchive(page, arch);
  else pageProject(page, shown, root);
  renderDetail();
  const left = pending().length, trb = $("tr");
  trb.hidden = !data.has_claude; trb.title = t("trTip"); trb.classList.toggle("on", autoTr); trb.setAttribute("aria-pressed", autoTr);
  trb.textContent = !autoTr ? t("trOff") : left && trBusy ? t("trBusy")(left) : t("trOn");
  document.title = needN ? t("title")(needN) : "Pult";
  if (fk && document.activeElement !== ae) { const n = document.querySelector(`[data-k="${CSS.escape(fk)}"]`); if (n) n.focus({preventScroll: true}); }
}
function query() {
  if (range) return `from=${range[0]}&to=${range[1]}`;
  const d = new Date(); if (days === 1) d.setHours(0, 0, 0, 0); else d.setTime(d.getTime() - days * 864e5);
  return "from=" + d.getTime() / 1000;
}
const pending = () => !data ? [] : data.sessions.filter(s => s.chat && !s.archived && s.status !== "running" && !(s.tr && s.tr[lang]) && !trFailed.has(s.id + lang));
async function translateLoop() {
  if (trBusy || !autoTr) return;
  trBusy = true;
  while (autoTr && pending().length) {
    render();
    const ids = pending().slice(0, 8).map(s => s.id), r = await post("/api/translate", {ids});
    if (!r.ok || !r.done) ids.forEach(i => trFailed.add(i + lang));
    if (!r.ok) { toast(r.error || t("outdated")); break; }
    await load(true);
  }
  trBusy = false; render();
}
async function load(inner) {
  try { data = await (await fetch("/api/data?" + query())).json(); render(); if (!inner) translateLoop(); }
  catch (e) { toast(t("stopped")); }
}
function seg(id, attr, set) {
  $(id).onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    [...b.parentNode.children].forEach(x => x.classList.toggle("on", x === b));

seg("days", "d", d => { days = +d; range = null; $("from").value = $("to").value = ""; load(); });
function dates() {
  const f = $("from").value, to = $("to").value;
  if (!f && !to) return;
  range = [f ? new Date(f + "T00:00").getTime() / 1000 : 0, to ? new Date(to + "T23:59:59").getTime() / 1000 : Date.now() / 1000 + 60];
  document.querySelectorAll("#days button").forEach(b => b.classList.remove("on")); load();
}
$("from").onchange = $("to").onchange = dates;
$("dateMenu").ontoggle = () => { const m = $("dateMenu"); if (m.open) { menuOpen = "dates"; placePop(m.querySelector(".pop"), m.querySelector("summary")); } else if (menuOpen === "dates") menuOpen = null; };
$("tr").onclick = () => { autoTr = !autoTr; save("pult-tr", autoTr ? "1" : "0"); render(); translateLoop(); };
seg("lang", "l", l => { lang = l; save("pult-lang", l); render(); setupRender(); translateLoop(); });
$("q").oninput = () => { q = $("q").value.trim().toLowerCase(); render(); };
document.querySelectorAll("#nav .nav").forEach(b => { b.dataset.k = "n" + b.dataset.v; b.onclick = () => go(b.dataset.v); });
$("menuBtn").onclick = () => document.body.classList.toggle("nav-open");
$("scrim").onclick = () => document.body.classList.remove("nav-open");
$("add").onclick = async () => {
  let r = await post("/api/add-folder", {});
  if (r.need_path) { const path = prompt(t("askPath")); if (!path) return; r = await post("/api/add-folder", {path}); }
  if (!r.ok && r.error) alert(r.error);
  await load();
  if (r.root && data && data.projects.some(p => p.root === r.root)) go("p=" + r.root);

let setup = null, setupBusy = false, setupErr = "", setupNote = "";
async function setupLoad() {
  const r = await post("/api/setup", {});
  if (r.ok) setup = r; else setupErr = r.error || t("outdated");
  setupRender();
}
async function setupDo(path, body) {

  const r = await post(path, body);
  if (!r.ok) setupErr = r.error || t("outdated");
  setupBusy = false; await setupLoad();
}
function setupRow(on, title, desc, path, disabled) {
  const row = el("div", "srow"), tx = el("div", "tx");
  row.append(el("span", "ic " + (on ? "ok" : "no"), on ? "\u2714" : "\u25CB"));
  tx.append(el("b", "", title), el("span", "", desc)); row.append(tx);
  if (path) { const b = el("button", "btn" + (on ? "" : " main"), on ? t("turnOff") : t("turnOn"));
    b.disabled = setupBusy || disabled; b.onclick = () => setupDo(path, {on: !on}); row.append(b); }
  return row;
}
function setupRender() {
  document.querySelectorAll("#setup [data-t]").forEach(e => { e.textContent = t(e.dataset.t); });
  const body = document.getElementById("setupBody"); body.replaceChildren();
  if (!setup) { body.append(el("div", setupErr ? "err" : "", setupErr || t("working"))); return; }
  const s = setup, noRepo = !s.repo, badSettings = !!s.settings_error;
  if (noRepo) body.append(el("div", "err", t("repoMissing")));
  if (badSettings) {
    body.append(el("div", "err", s.settings_error));

      const ra = el("div", "acts"); ra.append(rb, el("span", "ask", t("repairD"))); body.append(ra); }

    }
    setupBusy = false; await setupLoad();
  };
  const top = el("div", "acts"); top.append(all); body.append(top);
  body.append(setupRow(s.hooks, t("sHooks"), t("sHooksD"), "/api/setup/hooks", noRepo || badSettings),
              setupRow(s.mcp, t("sMcp"), t("sMcpD"), "/api/setup/mcp", noRepo || !s.has_claude),
              setupRow(s.rule, t("sRule"), t("sRuleD"), "/api/setup/rule", false));
  const fr = el("div", "srow"), ftx = el("div", "tx");
  fr.append(el("span", "ic " + (s.folders.some(f => f.covered) || s.registered.length ? "ok" : "no"), s.registered.length ? "\u2714" : "\u25CB"));
  ftx.append(el("b", "", t("sFolders")), el("span", "", t("sFoldersD")));
  const ul = el("ul", "slist");
  if (!s.folders.length) ul.append(el("li", "", t("noneAdded")));
  s.folders.forEach(f => {
    const li = el("li", "", f.path + " \u2014 " + (f.covered ? t("covered") : t("notCovered")) + " ");
    if (!f.covered) { const b = el("button", "btn", t("apply")); b.disabled = setupBusy || noRepo; b.onclick = () => setupDo("/api/setup/register", {id: f.path}); li.append(b); }
    ul.append(li);
  });
  if (s.registered.length) ul.append(el("li", "", t("registered") + s.registered.map(r => `${r.key} (${r.root})`).join(", ")));
  ftx.append(ul); fr.append(ftx); body.append(fr);
  const tr2 = el("div", "srow"), ttx = el("div", "tx");
  tr2.append(el("span", "ic no", "\u25B6")); ttx.append(el("b", "", t("testRow")), el("span", "", t("testRowD")));
  if (setupNote) ttx.append(el("div", "meta", setupNote));
  const tb = el("button", "btn", t("testBtn")); tb.disabled = setupBusy || !s.has_claude;
  tb.onclick = async () => {
    setupBusy = true; setupErr = ""; setupNote = ""; setupRender();
    const r = await post("/api/testbed", {});
    setupBusy = false; if (!r.ok) setupErr = r.error || t("outdated"); else setupNote = t("testDone")(r.started);
    await setupLoad(); load();
  };
  tr2.append(ttx, tb); body.append(tr2);
  if (setupErr) body.append(el("div", "err", setupErr));
  body.append(el("div", "snote", t("sNote")));
}
$("setupBtn").onclick = () => { setup = null; setupRender(); $("setup").showModal(); setupLoad(); };
$("setupClose").onclick = () => $("setup").close();
$("dens").onclick = () => { compact = !compact; save("pult-compact", compact ? "1" : "0"); render(); };
$("zoom").onclick = e => {

document.addEventListener("click", e => { if (menuOpen && !e.target.closest(".menu")) { closeMenus(); } });
document.addEventListener("scroll", e => { if (!(e.target.closest && e.target.closest(".pop"))) closeMenus(); }, true);
addEventListener("resize", closeMenus);
document.addEventListener("keydown", e => {

  if (e.key === "Escape") {

render(); load();
setInterval(() => { if (!Object.keys(busy).length && !trBusy && !menuOpen && !document.querySelector("dialog[open]")) load(); }, 10000);
