<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pult</title>
<style>
:root{
  color-scheme:light dark; --danger:#c0392b; --on-accent:#fff;
  --bg:#f3f1ec; --panel:#ebe8e1; --card:#fff; --ink:#1c2430; --mute:#6a7482; --line:#dcd8cf;
  --accent:#0f5b57; --run:#1f6fd0; --wait:#b96a00; --rev:#2e7d4f; --brk:#8a8f98;
}
@media (prefers-color-scheme: dark){
  :root{ --danger:#f07a6e; --on-accent:#0e1418; --bg:#12161c; --panel:#181d25; --card:#1f2630; --ink:#e8ecf1; --mute:#93a0b0; --line:#2c3541;
    --accent:#5fc7bf; --run:#6aa9f5; --wait:#f0a94a; --rev:#6fcf97; --brk:#8b95a3; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
header{position:relative;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:14px 112px 14px 20px;border-bottom:1px solid var(--line)}
#lang{position:absolute;top:14px;right:20px}
#lang button{width:38px}
h1{font-size:19px;margin:0;letter-spacing:.02em}
h1 small{font-weight:400;color:var(--mute);font-size:13px;margin-left:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--mute);padding:6px 12px;font:inherit;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.seg button:not(.on):hover{color:var(--ink)}
.spacer{flex:1}
.stat{color:var(--mute);font-size:13px}
#chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 20px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px 3px 8px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.off{opacity:.4}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
#board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(300px,420px);gap:14px;padding:14px 20px 28px;overflow-x:auto;align-items:start}
#board.fview{display:block;overflow:visible}
.fgroup{margin-bottom:22px}
.fgh{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin:0 0 10px}
.fgh h2{font-size:15px;margin:0}
.fgh span{color:var(--mute);font-size:12.5px;overflow-wrap:anywhere}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}
.fpath{font-size:12px;color:var(--mute);overflow-wrap:anywhere;margin:-4px 0 6px}
.flist{list-style:none;margin:0 0 6px;padding:0;font-size:12.5px}
.flist li{display:flex;justify-content:space-between;gap:10px;padding:2px 0;border-bottom:1px dotted var(--line)}
.flist li span:first-child{overflow-wrap:anywhere}
.flist li span:last-child{color:var(--mute);flex:none}
.ncf{margin-top:8px;display:grid;gap:6px}
.ncf textarea,.ncf select,.ncf option{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%}
.ncf textarea{min-height:64px;resize:vertical}
.ncf .row{display:flex;gap:6px}
.ncf .row select{flex:1}
.col{background:var(--panel);border-radius:12px;padding:10px;min-height:120px}
.col h2{font-size:13px;margin:2px 4px 10px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.06em}
.col h2 b{font-weight:600;color:var(--mute)}
.col .hint{color:var(--mute);font-size:12px;margin:-6px 4px 10px;text-transform:none;letter-spacing:0}
.card{background:var(--card);border-radius:10px;padding:11px 12px 10px;margin-bottom:9px;border-left:4px solid var(--c);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute);margin-bottom:4px}
.proj{color:var(--c);font-weight:600;overflow-wrap:anywhere}
.title{font-weight:600;margin-bottom:6px;overflow-wrap:anywhere}
.card ul{margin:0 0 6px;padding-left:17px}
.card li{margin-bottom:2px;overflow-wrap:anywhere}
.lab{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin:6px 0 2px}
.ask{color:var(--mute);font-size:13px;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--mute);margin-top:6px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:7px;padding:4px 9px;font:inherit;font-size:12.5px;cursor:pointer}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn:not(:disabled):hover,.chip:hover{border-color:var(--mute)}
.btn.main:not(:disabled):hover{filter:brightness(1.08);border-color:var(--accent)}
.btn:focus-visible,.seg button:focus-visible,.chip:focus-visible,.menu summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn:disabled{opacity:.5;cursor:default}
.err{color:var(--danger);font-size:12px;margin-top:6px}
.empty{color:var(--mute);padding:8px 4px;font-size:13px}
#blank{max-width:560px;margin:60px auto;padding:0 20px;color:var(--mute)}
#blank b{color:var(--ink)}
.brief{background:var(--card);border-radius:10px;padding:9px 12px;margin-bottom:9px;border:1px dashed var(--line)}
.brief ul{margin:0;padding-left:17px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:11.5px;color:var(--mute);margin-left:6px;text-decoration:none}
.tag.flag{color:var(--wait);border-color:var(--wait)}
.colacts{display:flex;flex-wrap:wrap;gap:6px;margin:0 4px 10px}
.dates{display:inline-flex;align-items:center;gap:6px;color:var(--mute);font-size:13px}
.dates input{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:4px 6px}
.btn.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.col.small{opacity:.75}
footer{padding:0 20px 24px;color:var(--mute);font-size:12px;overflow-wrap:anywhere}
.card .title{font-size:15px;font-weight:700;line-height:1.3;padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.sumbox{background:color-mix(in srgb,var(--accent) 10%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 28%,var(--card));border-radius:8px;padding:8px 11px 7px;margin:2px 0 8px}
.sumbox .lab{color:var(--accent);margin:0 0 3px;font-weight:700}
.sumbox .lab::before{content:"\2726\00a0"}
.plainbox{padding:0 2px;margin-bottom:6px}
.plainbox .lab{margin-top:0}
.plink{border:0;background:none;padding:0;font:inherit;color:var(--c);font-weight:700;cursor:pointer;text-align:left;overflow-wrap:anywhere}
.plink:hover{text-decoration:underline}
.col.flash{outline:3px solid var(--accent);outline-offset:2px;transition:outline-color .6s}
#banner{background:#f6c344;color:#1c2430;padding:10px 20px;font-weight:600}
dialog#setup{border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);padding:0;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog#setup::backdrop{background:rgba(0,0,0,.45)}
.sh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.sh h2{margin:0;font-size:17px}
.sb{padding:12px 18px 18px}
.srow{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.srow .ic{font-size:16px;width:20px;flex:none;text-align:center;margin-top:1px}
.srow .tx{flex:1;min-width:0}
.srow .tx b{display:block;margin-bottom:2px}
.srow .tx span{color:var(--mute);font-size:13px;overflow-wrap:anywhere}
.ok{color:var(--rev)} .no{color:var(--mute)}
.snote{color:var(--mute);font-size:12.5px;margin-top:12px}
.slist{margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--mute)}
.card.clamp .plainbox li,.card.clamp .sumbox li{max-height:2.9em;overflow:hidden}
.card.clamp .plainbox li:nth-child(n+4),.card.clamp .sumbox li:nth-child(n+4){display:none}
.card.clamp .ask{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
body.compact .card .plainbox,body.compact .card .sumbox,body.compact .card .ask,body.compact .card .lab,body.compact .card .meta{display:none}
body.compact .card.open .plainbox,body.compact .card.open .sumbox,body.compact .card.open .ask,body.compact .card.open .lab,body.compact .card.open .meta{display:block}
body.compact .card .title{border-bottom:0;padding-bottom:0;margin-bottom:4px;font-size:14px}
.card .title{cursor:pointer}
.more{border:0;background:none;color:var(--mute);font:inherit;font-size:12px;padding:0;cursor:pointer;margin-bottom:4px}
.more:hover{color:var(--ink)}
.prio{font-size:10.5px;font-weight:700;letter-spacing:.06em;border-radius:4px;padding:1px 6px;margin-right:6px;text-transform:uppercase}
.prio{border:1px solid var(--pc);color:var(--pc);background:color-mix(in srgb,var(--pc) 14%,transparent)}
.prio.p3,.pdot.p3{--pc:var(--danger)}.prio.p2,.pdot.p2{--pc:var(--wait)}.prio.p1,.pdot.p1{--pc:var(--mute)}
.pdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pc,transparent);border:1px solid var(--pc,var(--line));margin-right:7px}
.card.isdone{opacity:.72}
.card.isdone .title{text-decoration:line-through;text-decoration-color:var(--mute)}
.menu{position:relative}
.menu summary{list-style:none;cursor:pointer}
.menu summary::-webkit-details-marker{display:none}
.menu .pop{position:fixed;z-index:20;top:0;left:0;min-width:170px;max-width:280px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:5px;box-shadow:0 6px 18px rgba(0,0,0,.18);display:grid;gap:2px}
.menu .pop button{border:0;background:none;color:var(--ink);font:inherit;font-size:13px;text-align:left;padding:6px 8px;border-radius:6px;cursor:pointer}
.menu .pop button:not(:disabled):hover{background:var(--panel)}
.menu .pop button.cur{background:color-mix(in srgb,var(--accent) 16%,transparent);font-weight:600}
.menu[open]>summary{border-color:var(--accent)}
.menu .pop button:disabled{opacity:.5;cursor:default}
.tools{display:inline-flex;gap:6px;align-items:center}
.pulse{animation:p 1.4s ease-in-out infinite}
@keyframes p{50%{opacity:.35}}
</style>
</head>
<body>
<div id="banner" hidden></div>
<header>
  <h1>Pult <small id="sub"></small></h1>
  <div class="seg" id="view"><button data-v="status" class="on" data-t="byStatus"></button><button data-v="project" data-t="byProject"></button><button data-v="archive" id="archTab"></button></div>
  <div class="seg" id="days"><button data-d="1" data-t="today"></button><button data-d="7" class="on" data-t="d7"></button><button data-d="30" data-t="d30"></button><button data-d="90" data-t="d90"></button><button data-d="3650" data-t="all"></button></div>
  <span class="dates"><span data-t="from"></span><input type="date" id="from"><span data-t="to"></span><input type="date" id="to"></span>
  <button class="btn" id="add" data-t="addFolder"></button>
  <button class="btn" id="tr"></button>
  <button class="btn" id="setupBtn" data-t="setup"></button>
  <span class="tools"><button class="btn" id="dens"></button><span class="seg" id="zoom"><button data-z="-1">A−</button><button data-z="0" id="zval"></button><button data-z="1">A+</button></span></span>
  <span class="spacer"></span>
  <span class="stat" id="stat"></span>
  <div class="seg" id="lang"><button data-l="en">EN</button><button data-l="de">DE</button></div>
</header>
<div id="chips"></div>
<div id="board"></div>
<div id="blank" hidden></div>
<footer id="foot"></footer>
<dialog id="setup"><div class="sh"><h2 data-t="setupTitle"></h2><button class="btn" id="setupClose" data-t="close"></button></div><div class="sb" id="setupBody"></div></dialog>

    if (!f.covered) { const b = el("button", "btn", t("apply")); b.disabled = setupBusy || noRepo; b.onclick = () => setupDo("/api/setup/register", {id: f.path}); li.append(b); }
    ul.append(li);
  });
  if (s.registered.length) ul.append(el("li", "", t("registered") + s.registered.map(r => `${r.key} (${r.root})`).join(", ")));
  ftx.append(ul); fr.append(ftx); body.append(fr);
  const tr2 = el("div", "srow"), ttx = el("div", "tx");
  tr2.append(el("span", "ic no", "\u25B6")); ttx.append(el("b", "", t("testRow")), el("span", "", t("testRowD")));
  if (setupNote) ttx.append(el("div", "meta", setupNote));
  const tb = el("button", "btn", t("testBtn")); tb.disabled = setupBusy || !s.has_claude;
  tb.onclick = async () => {
    setupBusy = true; setupErr = ""; setupNote = ""; setupRender();
    const r = await post("/api/testbed", {});
    setupBusy = false; if (!r.ok) setupErr = r.error || t("outdated"); else setupNote = t("testDone")(r.started);
    await setupLoad(); load();
  };
  tr2.append(ttx, tb); body.append(tr2);
  if (setupErr) body.append(el("div", "err", setupErr));
  body.append(el("div", "snote", t("sNote")));
}
document.getElementById("setupBtn").onclick = () => { setup = null; setupRender(); document.getElementById("setup").showModal(); setupLoad(); };
document.getElementById("dens").onclick = () => { compact = !compact; try { localStorage.setItem("pult-compact", compact ? "1" : "0"); } catch (e) {} render(); };
document.getElementById("zoom").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  zoomLevel = +b.dataset.z ? Math.max(-4, Math.min(5, zoomLevel + +b.dataset.z)) : 0;
  try { localStorage.setItem("pult-zoom", zoomLevel); } catch (e2) {} render();
};
document.addEventListener("click", e => { if (menuOpen && !e.target.closest(".menu")) { menuOpen = null; render(); } });
document.addEventListener("scroll", closeMenus, true); addEventListener("resize", closeMenus);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenus(); });
document.getElementById("setupClose").onclick = () => document.getElementById("setup").close();
render(); load(); setInterval(() => { if (!Object.keys(busy).length && !trBusy && !ncOpen && !menuOpen) { load(); } }, 10000);
</script>
</body>
