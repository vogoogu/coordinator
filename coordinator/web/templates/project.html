<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>$title</title>
<link rel="stylesheet" href="/static/legacy.css"><script src="/static/board.js" defer></script></head>
<body><header><a href="/">Coordinator</a></header><main>
<h1>$key $name</h1>
<section class="inbox"><h2>Inbox</h2>$inbox</section>
<div class="board">$columns</div>
<h2>New task</h2>
<form method="post" action="/a/create">$token_field
  <input type="hidden" name="project" value="$key">
  <label>Title <input name="title" required></label>
  <label>Goal <textarea name="goal"></textarea></label>
  <label>Done when <textarea name="done_when"></textarea></label>
  <label>Scope <textarea name="scope"></textarea></label>
  <button type="submit">Create</button>
</form>
</main></body></html>
