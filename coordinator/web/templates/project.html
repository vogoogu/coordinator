<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<link rel="stylesheet" href="/static/board.css"><script src="/static/board.js" defer></script></head>
<body><div class="page">
<header class="top">
  <a class="back" href="/">$icon_back<span class="lbl">All projects</span></a>
  <span class="vsep"></span>
  <h1 class="ptitle"><span class="mark s $tint" aria-hidden="true">$monogram</span>$name</h1>
  <div class="grow"></div>
  <span class="upd">Updated $updated</span>
  <a class="btn" href="/modes">$icon_modes<span class="lbl">Modes</span></a>
  <a class="btn" href="$here">$icon_refresh<span class="lbl">Refresh</span></a>
  <a class="btn primary wide-only" href="#new-task" data-dialog="new-task">$icon_plus New task</a>
</header>
<div class="narrow-only new-bar"><a class="btn primary wide" href="#new-task" data-dialog="new-task">$icon_plus New task</a></div>
$notice
$inbox
<main class="boardwrap">
<h2 class="vh">Task columns</h2>
<div class="board" tabindex="0" aria-label="Task columns. Scroll sideways for more.">$columns</div>
<div class="fade" aria-hidden="true"></div>
</main>
$dialog
<footer class="ver">Version $version</footer>
</div></body></html>
