<section class="card pc h-$tone" aria-labelledby="pc-$key">
  <div class="pc-top"><span class="mark $tint" aria-hidden="true">$monogram</span>
    <div><h2 class="nm" id="pc-$key"><a href="/p/$key">$name</a></h2><span class="pill $tone">$status_icon$status</span></div>
    <div class="pc-count"><b class="$count_class">$count</b><span>$count_word</span></div></div>
  $body
  <div class="pc-f">$chats$backlog<a href="/p/$key">Open board<span class="vh"> $name</span>$icon_chevron</a></div>
</section>
