<section class="card pc h-$tone" aria-labelledby="oc-$anchor">
  <div class="pc-top"><span class="mark $tint" aria-hidden="true">$mark</span>
    <div><h2 class="nm" id="oc-$anchor"><a href="/needs/$urlname">$name</a></h2><span class="pill $tone">$status_icon$status</span></div>
    <div class="pc-count"><b class="$count_class">$count</b><span>$count_word</span></div></div>
  <div>$rows</div>
  <div class="pc-f"><span class="muted">$foot</span><a href="/needs/$urlname">Open all$icon_chevron</a></div>
</section>
